# ==============================================================================
# NGINX PRODUCTION CONFIG — https://nomadhub.aldoarbizu.com/ (Mozilla A+ Grade)
# Target OS: Ubuntu 24.04 LTS (Hetzner VPS / Cloudflare Tunnel Compatible)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name nomadhub.aldoarbizu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nomadhub.aldoarbizu.com;

    root /var/www/nomadhub.aldoarbizu.com;
    index index.html START_NOMAD_ARK.html;

    # TLS 1.2 / 1.3 Certificates (Let's Encrypt / Certbot or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/nomadhub.aldoarbizu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nomadhub.aldoarbizu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Mozilla Observatory A+ Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self' https://github.com https://objects.githubusercontent.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:8081 https://generativelanguage.googleapis.com;" always;

    # Gzip Compression for Offline-First PWA Speed
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml application/epub+zip;
    gzip_min_length 256;

    # Service Worker & Manifest must revalidate immediately
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
